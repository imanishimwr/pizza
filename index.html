<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotPot Delights - Authentic Hotpot & Gourmet Delivery</title>
    <meta name="description" content="Order authentic hotpot combos, spicy broths, gourmet pizzas, and sides delivered fresh in Kigali, Rwanda." />
    <meta name="theme-color" content="#AE3200" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map Tracking -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Tailwind CSS Engine CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#AE3200',
                hover: '#c93b00',
                light: 'rgba(174, 50, 0, 0.15)',
              },
              accent: {
                gold: '#F59E0B',
                red: '#E53935',
                green: '#128731',
                blue: '#0288D1',
                purple: '#8B5CF6',
              },
              surface: {
                dark: '#1A1716',
                card: '#231E1C',
                'card-hover': '#2D2724',
                input: '#171413',
              },
              'bg-dark': '#120F0E',
              'text-main': '#F7F4F2',
              'text-muted': '#A39B96',
              'text-subdued': '#736B66',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-bg-dark text-text-main font-sans antialiased selection:bg-primary selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
